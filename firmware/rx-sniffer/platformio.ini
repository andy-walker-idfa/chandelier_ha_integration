; Receive-only XN297 remote analyzer (ESP32 + nRF24L01+).
; Standalone PlatformIO project — no transmit, no Wi-Fi, no dependencies beyond
; the Arduino framework. See README.md in this folder.

[env:esp32-s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

monitor_speed = 115200
monitor_echo = yes
monitor_eol = LF
monitor_filters = send_on_enter

; ESP32-S3 has native USB with no separate UART chip: serial output only appears
; if this flag is set. Harmless on boards with a UART bridge, so it is left on.
build_flags = -DARDUINO_USB_CDC_ON_BOOT=1

; --- For a classic ESP32 DevKit instead, comment the two lines above and use: ---
; [env:esp32dev]
; platform = espressif32
; board = esp32dev
; framework = arduino
; monitor_speed = 115200
