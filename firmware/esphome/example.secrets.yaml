# Copy this file to secrets.yaml (same folder) and fill in your values.
# secrets.yaml is gitignored — never commit real credentials.

wifi_ssid: "YourNetwork"
wifi_password: "YourWiFiPassword"

# Fallback access point password (shown if Wi-Fi is unreachable).
ap_password: "set-a-fallback-ap-password"

# Home Assistant API encryption key. Generate one with:
#   openssl rand -base64 32
# or let the ESPHome dashboard generate it when you adopt the device.
# OTA reuses this same key (ota: encryption:), so there is no separate OTA password.
api_encryption_key: "base64-32-byte-key-goes-here"
