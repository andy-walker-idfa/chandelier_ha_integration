[env:esp32-s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

monitor_speed = 115200
monitor_echo = yes
monitor_eol = LF
monitor_filters = send_on_enter

; Если у платы только один USB-порт (встроенный USB, без чипа UART)
; и монитор порта пустой - раскомментируйте строку ниже:
build_flags = -DARDUINO_USB_CDC_ON_BOOT=1
